<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Occlusion 2026 Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 15px;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      background: #111827;
      color: white;
      padding: 18px;
      border-radius: 12px;
      font-size: 24px;
    }

    .card {
      background: white;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000015;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    select, input {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .stop {
      background: #e5e7eb;
      color: #111827;
    }

    .verify {
      background: #15803d;
      color: white;
    }

    #reader {
      width: 100%;
      overflow: hidden;
    }

    #result {
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      background: #f3f4f6;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .waiting {
      background: #fef3c7 !important;
      color: #92400e;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Occlusion 2026</h1>

  <div class="card">
    <label for="eventDay">Event Day</label>
    <select id="eventDay">
      <option value="1">Day 1</option>
      <option value="2">Day 2</option>
      <option value="3">Day 3</option>
    </select>

    <label for="gate">Entry Gate</label>
    <select id="gate">
      <option value="Main Gate">Main Gate</option>
      <option value="Gate 1">Gate 1</option>
      <option value="Gate 2">Gate 2</option>
      <option value="Gate 3">Gate 3</option>
      <option value="Gate 4">Gate 4</option>
    </select>
  </div>

  <div class="card">
    <div id="reader"></div>

    <button class="start" id="startBtn" type="button">
      Start Back Camera
    </button>

    <button class="stop" id="stopBtn" type="button">
      Stop Camera
    </button>

    <label for="manualId">Manual ID Entry</label>
    <input id="manualId" placeholder="ITSOCC26001"
           autocomplete="off" autocapitalize="characters">

    <button class="verify" id="verifyBtn" type="button">
      Verify ID
    </button>

    <div id="result" aria-live="polite">
      <h3>Ready to Scan</h3>
      Select event day and gate, then start the camera.
    </div>
  </div>
</div>

<script>
  // APPS SCRIPT BACKEND
  const API_URL =
    "https://script.google.com/a/macros/its.edu.in/s/AKfycbwu4fHmYcVp1pGyQ2zE_tf1DhILt5eywEFN8KxWpCArsO19QbdsILrsdnGoT5BGqdqk/exec";

  let scanner = null;
  let cameraRunning = false;
  let busy = false;
  let callbackCounter = 0;
  let lastId = "";
  let lastTime = 0;

  const resultBox = document.getElementById("result");

  function showResult(type, heading, lines) {
    resultBox.className = type;
    resultBox.replaceChildren();

    const title = document.createElement("h3");
    title.textContent = heading;
    resultBox.appendChild(title);

    lines.forEach(line => {
      const p = document.createElement("p");
      p.textContent = line;
      resultBox.appendChild(p);
    });
  }

  // Send scanned ID to Apps Script through JSONP
  function verifyId(rawId) {
    const id = String(rawId || "").trim().toUpperCase();

    if (!id) {
      showResult("error", "ID REQUIRED", ["Scan a QR code or enter an ID."]);
      return Promise.resolve();
    }

    if (busy) return Promise.resolve();

    busy = true;

    const gate = document.getElementById("gate").value;
    const day = document.getElementById("eventDay").value;

    showResult("waiting", "Checking ID...", [
      "ID: " + id,
      "Please wait."
    ]);

    return new Promise(resolve => {
      const callback = "occlusionCallback" + (++callbackCounter);
      const script = document.createElement("script");
      let finished = false;

      function finish(data, error) {
        if (finished) return;
        finished = true;

        clearTimeout(timer);
        script.remove();
        delete window[callback];
        busy = false;
        document.getElementById("manualId").value = "";

        if (error) {
          showResult("error", "CONNECTION ERROR", [error]);
          resolve();
          return;
        }

        if (!data || data.error) {
          showResult("error", "SERVER ERROR", [
            data && data.error ? data.error : "Unexpected server response."
          ]);
          resolve();
          return;
        }

        if (data.ok) {
          showResult("success", "MATCH — ENTRY ALLOWED", [
            "Name: " + (data.name || ""),
            "ID: " + (data.id || id),
            "Gate: " + (data.gate || gate),
            "Day: " + day,
            "Time: " + (data.time || "")
          ]);

          if (navigator.vibrate) navigator.vibrate(150);
        } else {
          showResult("error", "NO MATCH — ENTRY NOT ALLOWED", [
            "ID: " + (data.id || id),
            "Gate: " + (data.gate || gate),
            "Time: " + (data.time || "")
          ]);

          if (navigator.vibrate) navigator.vibrate(300);
        }

        resolve();
      }

      window[callback] = data => finish(data, null);

      script.onerror = () => finish(
        null,
        "Apps Script load nahi hua. Deployment URL aur access settings check karein."
      );

      const params = new URLSearchParams({
        action: "scan",
        id: id,
        gate: gate,
        day: day,
        callback: callback
      });

      script.src = API_URL + "?" + params.toString();

      const timer = setTimeout(() => finish(
        null,
        "Server response nahi aaya. Internet aur Apps Script deployment check karein."
      ), 15000);

      document.body.appendChild(script);
    });
  }

  // CAMERA START
  async function startCamera() {
    if (cameraRunning) return;

    if (!window.Html5Qrcode) {
      showResult("error", "SCANNER LIBRARY ERROR", [
        "QR library load nahi hui. Internet check karke page reload karein."
      ]);
      return;
    }

    try {
      document.getElementById("startBtn").disabled = true;

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      showResult("waiting", "Starting Camera", [
        "Camera permission allow karein."
      ]);

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        async decodedText => {
          const now = Date.now();

          if (busy) return;
          if (decodedText === lastId && now - lastTime < 2500) return;

          lastId = decodedText;
          lastTime = now;

          if (scanner && cameraRunning) {
            try { scanner.pause(true); } catch (e) {}
          }

          await verifyId(decodedText);

          if (scanner && cameraRunning) {
            try { scanner.resume(); } catch (e) {}
          }
        },
        () => {}
      );

      cameraRunning = true;

      showResult("", "Camera Ready", [
        "QR code ko camera frame ke andar rakhein."
      ]);

    } catch (error) {
      showResult("error", "CAMERA ERROR", [
        String(error.message || error),
        "HTTPS website use karein aur browser camera permission allow karein."
      ]);

    } finally {
      document.getElementById("startBtn").disabled = false;
    }
  }

  // CAMERA STOP
  async function stopCamera() {
    try {
      if (scanner && cameraRunning) {
        await scanner.stop();
        await scanner.clear();
      }
    } catch (error) {
      console.log(error);
    }

    cameraRunning = false;
    scanner = null;

    showResult("", "Camera Stopped", [
      "Dobara start karne ke liye Start Back Camera dabayein."
    ]);
  }

  document.getElementById("startBtn").addEventListener("click", startCamera);
  document.getElementById("stopBtn").addEventListener("click", stopCamera);

  document.getElementById("verifyBtn").addEventListener("click", () => {
    verifyId(document.getElementById("manualId").value);
  });

  document.getElementById("manualId").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      verifyId(document.getElementById("manualId").value);
    }
  });
</script>

</body>
</html>
